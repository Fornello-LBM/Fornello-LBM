<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Fornello — Le Blanc-Mesnil</title>
<meta name="description" content="Fornello x Les Jumeaux — Pizze, Panuozzo, Nuvola, Dolci. Halal. Sur place ou à emporter, 200 av. Paul Couturier, Le Blanc-Mesnil.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- HERO -->
<header class="hero">
  <div class="hero-badge" aria-hidden="true">
    <span class="halal-mark">حلال</span>
    <span class="halal-label">Halal</span>
  </div>
  <div class="hero-inner">
    <img class="hero-logo" src="images/logo.png" alt="Fornello">
    <p class="hero-partner">x Les Jumeaux <span class="dot">·</span> depuis 2010</p>
    <h1 class="hero-tagline">Plata<br>o Forno</h1>
    <a class="hero-cta" href="#menu">Voir la carte</a>
  </div>
  <svg class="hero-divider" viewBox="0 0 1440 90" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0,40 C 240,90 480,0 720,30 C 960,60 1200,10 1440,45 L1440,90 L0,90 Z"></path>
  </svg>
</header>

<!-- MENU -->
<main id="menu">
  <div id="menu-root" class="menu-root">
    <!-- injected by script.js -->
  </div>
</main>

<!-- FOOTER -->
<footer class="site-footer">
  <svg class="footer-divider" viewBox="0 0 1440 60" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0,20 C 240,55 480,0 720,25 C 960,50 1200,5 1440,30 L1440,0 L0,0 Z"></path>
  </svg>
  <div class="footer-inner">
    <img class="footer-logo" src="images/logo.png" alt="Fornello">
    <p class="footer-address" id="footer-address">200 av. Paul Couturier — Le Blanc-Mesnil</p>
    <p class="footer-phone" id="footer-phone">07 66 97 32 00</p>
    <p class="footer-service" id="footer-service">Sur place — à emporter</p>
    <p class="footer-note">Tarifs sous réserve d'erreurs typographiques. La direction se réserve le droit de modifier ses prix. Images non contractuelles.</p>
  </div>
</footer>

<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
<script>
  if (window.netlifyIdentity) {
    window.netlifyIdentity.on("init", user => {
      if (!user) {
        window.netlifyIdentity.on("login", () => {
          document.location.href = "/admin/";
        });
      }
    });
  }
</script>
<script src="script.js"></script>
</body>
</html>
