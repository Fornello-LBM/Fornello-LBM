backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "images"

collections:
  - name: "menu"
    label: "Carte"
    files:
      - name: "menu"
        label: "Carte Fornello"
        file: "content/menu.json"
        fields:
          - label: "Restaurant"
            name: "restaurant"
            widget: "object"
            fields:
              - { label: "Nom", name: "name", widget: "string" }
              - { label: "Partenaire", name: "partner", widget: "string", required: false }
              - { label: "Depuis", name: "since", widget: "string", required: false }
              - { label: "Slogan", name: "tagline", widget: "string" }
              - { label: "Halal", name: "halal", widget: "boolean" }
              - { label: "Adresse", name: "address", widget: "string" }
              - { label: "Ville", name: "city", widget: "string" }
              - { label: "Téléphone", name: "phone", widget: "string" }
              - { label: "Service (sur place / à emporter)", name: "service", widget: "string" }
          - label: "Catégories du menu"
            name: "categories"
            widget: "list"
            fields:
              - { label: "Identifiant (sans espace)", name: "id", widget: "string" }
              - { label: "Titre", name: "title", widget: "string" }
              - { label: "Sous-titre", name: "subtitle", widget: "string", required: false }
              - label: "Plats"
                name: "items"
                widget: "list"
                required: false
                fields:
                  - { label: "Nom du plat", name: "name", widget: "string" }
                  - { label: "Prix", name: "price", widget: "string" }
                  - { label: "Description", name: "desc", widget: "text", required: false }
                  - { label: "Photo", name: "image", widget: "image", required: false }
              - label: "Formule à composer (si applicable)"
                name: "composer"
                widget: "object"
                required: false
                fields:
                  - { label: "Prix de base", name: "base_price", widget: "string", required: false }
                  - label: "Groupes de choix"
                    name: "groups"
                    widget: "list"
                    required: false
                    fields:
                      - { label: "Nom du groupe", name: "label", widget: "string", required: false }
                      - { label: "Options", name: "options", widget: "list", required: false }
                  - label: "Suppléments"
                    name: "supplements"
                    widget: "list"
                    required: false
                    fields:
                      - { label: "Libellé", name: "label", widget: "string", required: false }
                      - { label: "Prix", name: "price", widget: "string", required: false }
                  - label: "Charcuteries en supplément"
                    name: "charcuteries_extra"
                    widget: "list"
                    required: false
                    fields:
                      - { label: "Libellé", name: "label", widget: "string", required: false }
                      - { label: "Prix", name: "price", widget: "string", required: false }
